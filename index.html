<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas></canvas>

    <div id="welcome">
        <h1>WELCOME!</h1>
        <p>This is a random generated star simulation. Please note that your PC might not handle the heavier renderings. Otherwise have fun!</p>
        <button id="startButton">Start simulation</button>
    </div>

    <button id="menuButton">></button>

    <div id="sidebar">
        <h2>Options</h2>
        <label>
            Amount
            <input type="number" id="starCount" value="2000" min="0" max="10000" step="100"> 
        </label>
        <label>
            Size
            <div class="size-inputs">
                <input type="number" id="minSize" placeholder="min" value="0.2" min="0" max="5" step="0.1">
                <input type="number" id="maxSize" placeholder="max" value="2.5" min="0" max="5" step="0.1">
            </div>
        </label>
        <label>
            Animation
            <select id="rotationSpeed">
                <option value="0">none</option>
                <option value="0.0005" selected="true">slow</option>
                <option value="0.003">fast</option>
            </select>
        </label>
        <label>
            Graphics
            <select id="graphics">
                <option value="fast">fast</option>
                <option value="fancy" selected="true">fancy</option>
                <option value="glow">glow</option>
            </select>
        </label>
        <button id="regenerateButton">Regenerate</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
